services:
  waitlist-db:
    image: mysql:8.0
    container_name: ourlovecanvas-waitlist-db
    restart: unless-stopped
    command: --default-time-zone='+00:00'
    environment:
      MYSQL_ROOT_PASSWORD: my-root-password
      MYSQL_DATABASE: waitlist
      MYSQL_USER: waitlist-user
      MYSQL_PASSWORD: waitlist-password
    volumes:
      - waitlist_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  waitlist-backend:
    build: ./waitlist-backend
    container_name: ourlovecanvas-waitlist-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://waitlist-user:waitlist-password@waitlist-db:3306/waitlist
      PORT: 3001
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY}
      GMAIL_USER: ourlovecanvasofficial@gmail.com
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      VIRTUAL_HOST: api.ourlovecanvas.com
      VIRTUAL_PORT: 3001
      LETSENCRYPT_HOST: api.ourlovecanvas.com
    depends_on:
      waitlist-db:
        condition: service_healthy
    networks:
      - internal
      - proxy-network

  waitlist-frontend:
    build: ./waitlist-frontend
    container_name: ourlovecanvas-waitlist-frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ourlovecanvas.com,www.ourlovecanvas.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ourlovecanvas.com,www.ourlovecanvas.com
    networks:
      - proxy-network

  waitlist-dashboard:
    build: ./waitlist-dashboard
    container_name: ourlovecanvas-waitlist-dashboard
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: dashboard.ourlovecanvas.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: dashboard.ourlovecanvas.com
    networks:
      - proxy-network

volumes:
  waitlist_mysql_data:

networks:
  internal:
    driver: bridge
  proxy-network:
    external: true
